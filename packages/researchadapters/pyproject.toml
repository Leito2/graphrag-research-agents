[project]
name = "researchadapters"
version = "0.1.0"
description = "Adapters for the researchcore ports: the vault on disk, Neo4j, and later Qdrant, search and LLMs."
requires-python = ">=3.12"
dependencies = ["researchcore"]

[tool.uv.sources]
researchcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchadapters"]
