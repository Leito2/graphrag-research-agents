# Profiles (PLAN §11): core (8 GB) | full (⏳16GB: Langfuse self-hosted, Microsoft GraphRAG over the whole vault).
# The vault is mounted READ-ONLY; only the research output folder is writable (ADR-3).
x-core: &core
  profiles: ["core", "full"]

services:
  neo4j:
    <<: *core
    image: neo4j:community                   # pin a version in M1 (calendar versioning since 2025)
    environment:
      NEO4J_AUTH: neo4j/research-dev-only
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    ports: ["7474:7474", "7687:7687"]
    mem_limit: 1400m

  qdrant:
    <<: *core
    image: qdrant/qdrant:latest              # pin in M1
    ports: ["6333:6333"]
    mem_limit: 400m

  postgres:                                  # LangGraph checkpointer
    <<: *core
    image: postgres:17
    environment: { POSTGRES_DB: research, POSTGRES_USER: research, POSTGRES_PASSWORD: research }
    ports: ["5432:5432"]
    mem_limit: 250m

  redis:                                     # gateway cache + web result cache
    <<: *core
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb"]
    ports: ["6379:6379"]
    mem_limit: 250m

  searxng:                                   # self-hosted metasearch (replaces Tavily, ADR-7)
    <<: *core
    image: searxng/searxng:latest            # pin in M6
    volumes: ["./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    ports: ["8888:8080"]
    mem_limit: 250m

  llm-gateway:
    <<: *core
    build: ../llm-gateway                    # P0 — aliases smart, vision, extract, judge
    env_file: ../llm-gateway/.env.example
    environment: { GW_REDIS_URL: "redis://redis:6379/1" }
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8080:8080"]
    mem_limit: 700m

  # ingest (watcher), agents, MCP servers (vault, graph, web, scholar, code), sandbox and API arrive in M1–M7.
  # They mount:  ${VAULT_PATH}:/vault:ro   and   ${VAULT_PATH}/${RESEARCH_OUTPUT_DIR}:/vault-out:rw
