[project]
name = "researchcore"
version = "0.1.0"
description = "Shared contracts (research state, evidence, contradictions), graph schema and the deterministic Leader."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchcore"]
